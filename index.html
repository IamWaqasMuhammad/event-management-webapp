<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Horizon</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">◈</span>
        <h1>Event Horizon - Event Management</h1>
      </div>
      <p class="tagline">Manage Your Moments</p>
    </div>
    <div class="header-stripe"></div>
  </header>

  <!-- MAIN -->
  <main>

    <!-- ADD EVENT FORM -->
    <section class="form-section">
      <h2 class="section-title">Add New Event</h2>
      <div class="form-card">
        <div class="form-group">
          <label for="eventName">Event Name</label>
          <input type="text" id="eventName" placeholder="e.g. Tech Conference 2025" />
        </div>
        <div class="form-group">
          <label for="eventDate">Event Date</label>
          <input type="date" id="eventDate" />
        </div>
        <div class="form-group">
          <label for="eventDesc">Event Description</label>
          <textarea id="eventDesc" rows="3" placeholder="Describe the event..."></textarea>
        </div>
        <div id="formWarning" class="warning hidden">⚠ All fields are required.</div>
        <button id="addEventBtn" class="btn-add">+ Add Event</button>
      </div>
    </section>

    <!-- SEARCH BAR -->
    <section class="search-section">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="searchInput" placeholder="Search events by name or date..." />
      </div>
    </section>

    <!-- EVENTS LIST -->
    <section class="events-section">
      <h2 class="section-title">Upcoming Events <span id="eventCount" class="count-badge">0</span></h2>
      <div id="eventList" class="event-grid">
        <!-- Events rendered by JS -->
      </div>
      <div id="noEvents" class="no-events hidden">No events found.</div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>Designed &amp; Developed by <span class="footer-name">Waqas Muhammad</span> &nbsp;|&nbsp; &copy; <span id="footerYear"></span> Event Horizon</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
